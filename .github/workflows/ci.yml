name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # The module models come from the client repository as a submodule.
          submodules: recursive

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
          dotnet-quality: preview

      - name: Build
        run: dotnet build src\ReportMate.App.csproj --configuration Release

      - name: Test
        run: dotnet test tests\ReportMate.App.Tests\ReportMate.App.Tests.csproj --configuration Release --logger "console;verbosity=normal"
